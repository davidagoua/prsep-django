services:
  
  web:
    build:
      context: ./app
    volumes:
      - type: bind
        target: /app
        source: ./app
      - ./app:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/medias
    expose:
      - "8000"
    env_file: ./.env
    depends_on:
      - postgis
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DEBUG: "True" 
      SECRET_KEY: ${SECRET_KEY} 
      ALLOWED_HOSTS: "*"



  nginx:
    build:
      context: ./nginx
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/medias
      - ./nginx/ssl/:/etc/letsencrypt/
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - web


  cartographie:
    build:
      context: ./static
    volumes:
      - ./static:/app
      - static_volume:/app/static/assets
    ports:
      - "9000:9000"
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY}
      - ALLOWED_HOSTS="*"
    depends_on:
      - postgis

  postgis:
    image: postgis/postgis:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data/


  collabora:
    image: collabora/code:latest
    container_name: collabora-online
    restart: unless-stopped
    environment:
      - domain=collabora-${DOMAIN_NAME}
      - username=${COLLABORA_USER}
      - password=${COLLABORA_PWD}
      - DONT_GEN_SSL_CERT=true
      - extra_params=--o:ssl.enable=false --o:ssl.termination=true
    expose:
      - "9980"
    volumes:
      - collabora_data:/var/log/cool
      - ./collabora/collwsd.xml:/etc/collwsd/collwsd.xml



volumes:
  postgres_data:
  static_volume:
  media_volume:
  collabora_data:
